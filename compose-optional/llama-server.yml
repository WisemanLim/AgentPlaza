# 선택 오버레이 — llama.cpp 서버(D1-02, GGUF, CPU/GPU). models 볼륨에 GGUF 를 두고 경로를 지정한다.
#   PUT /api/llm/servers/llamacpp {"base_url": "http://llama-server:8080/v1", "local": true}
services:
  llama-server:
    image: ghcr.io/ggml-org/llama.cpp:server
    command: ["-m", "/models/${LLAMA_GGUF:-model.gguf}", "--host", "0.0.0.0", "--port", "8080", "-c", "8192", "--jinja"]
    volumes: ["gguf-models:/models:ro"]
    deploy: { resources: { limits: { cpus: "4", memory: 8G } } }
    labels:
      agentplaza.project: ${PLAZA_PROJECT:-plaza}
    restart: unless-stopped
volumes:
  gguf-models:
